name: Docker publish
on:
  push:
    branches: [main]
permissions: 
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Login to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Build and push docker image
        run: |
          docker build . -t ghcr.io/asmisloff/skills-publish-docker-images/stackoverflown:main
          docker push ghcr.io/asmisloff/skills-publish-docker-images/stackoverflown:main